<template id="ar-target">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    .question-panel-3d {
      width: 380px;
      padding: 18px;
      background: rgba(10, 10, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .question-header {
      font-size: 16px;
      font-weight: 700;
      color: #00ffaa;
      margin-bottom: 10px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .question-img-wrap {
      width: 100%;
      height: 140px;
      margin-bottom: 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      display: {{imgDisplay}};
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .question-img {
      max-width: 100%;
      max-height: 140px;
      object-fit: contain;
    }
    .question-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
      margin-bottom: 14px;
      color: #f8fafc;
    }
    .quest-options-grid {
      display: grid;
      gap: 8px;
    }
    .quest-btn {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 13px;
      text-align: left;
      font-family: inherit;
    }
    .quest-input-block {
      display: flex;
      gap: 8px;
    }
    .quest-input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
    }
    .quest-submit-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #00cc66;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
    }
    .quest-ok-btn {
      display: block;
      margin: 10px auto 0 auto;
    }
    .quest-slider {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .slide-content {
      flex: 1;
      text-align: center;
      font-size: 13px;
      white-space: pre-line;
      line-height: 1.4;
    }
    .slide-nav {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
    }
  </style>

  <sphere
    name="sphere"
    data-radius="0.01"
    data-position="0.000,0.000,0.000"
    data-rotation="0,0,0"
  ></sphere>

  <panel
    name="questionPanel"
    data-width="0.32"
    data-height="0.38"
    data-position="0.000,0.000,0.020"
    data-rotation="-90,0,0"
  >
    <div class="panel question-panel-3d">
      <div class="question-header">{{title}}</div>
      <div class="question-img-wrap">
        <img class="question-img" src="{{imageSrc}}" alt="preview" />
      </div>
      <div class="question-text">{{question}}</div>
      <div class="question-body">
        {{interactiveBody}}
      </div>
    </div>
  </panel>

  <panel
    name="okButton"
    data-width="0.16"
    data-height="0.06"
    data-position="0.000,-0.220,0.020"
    data-rotation="-90,0,0"
  >
    <div class="panel" style="width: 256px; height: 96px; background: rgba(0, 40, 20, 0.95); border-radius: 12px; border: 2px solid #00ff99; display: flex; align-items: center; justify-content: center;">
      <div class="button" style="color: #ffffff; font-family: sans-serif; font-weight: bold; font-size: 32px; text-align: center;">{{okText}}</div>
    </div>
  </panel>
</template>
