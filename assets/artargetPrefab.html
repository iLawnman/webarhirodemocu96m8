<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>AR Target Prefab</title>
    <!--
      Структура AR-таргета (CSS3D).
      Панели всегда присутствуют. Заполнение — из targetData / JSON.
      Позиции и повороты заданы в data-* (метры / градусы).

      Макет (соответствует artarget.js / PANEL_DEFAULTS):
            [ LeftHelp ]  [ MainBlock ]  [ RightBlock ]
                                [ ButtonsBlock ]

      Значения ниже подобраны от РЕАЛЬНЫХ размеров панелей в px * scale
      (см. .ar-*-block width/min-height/max-height ниже), с расчётом на
      max-height, чтобы панели НЕ пересекались даже при максимально
      длинном контенте. Верхние края LeftHelp/Main/Right выровнены по
      общей линии Y_top ≈ 0.09 (у Main центр ниже — она выше и крупнее).
      Если меняешь width/height в CSS — пересчитай эти позиции.

      LeftHelpBlock  (-0.17,  0.042, 0.001)  rot(-90, 12, 0)  scale 0.00048
      MainBlock      ( 0.00,  0.03,  0.002)  rot(-90,  0, 0)  scale 0.0005
      RightBlock     ( 0.17,  0.042, 0.001)  rot(-90,-12, 0)  scale 0.00048
      ButtonsBlock   ( 0.00, -0.075, 0.004)  rot(-90,  0, 0)  scale 0.0005

      Про Z: раньше у всех панелей z=0 (одна плоскость) — из-за этого
      CSS3DRenderer каждый кадр пересортировывал их почти случайно при
      движении камеры (расстояния до камеры были почти равны), что давало
      мерцание текста и позволяло "невидимой" по z-порядку панели
      перехватывать клики у ButtonsBlock. Теперь у каждой панели свой,
      явно разный z (в метрах, миллиметровые значения) — порядок глубины
      однозначен и стабилен: ButtonsBlock всегда ближе всех (интерактивный
      слой не должен ничем перекрываться), дальше MainBlock, дальше всех —
      LeftHelp/Right.

      Эти же значения продублированы в artarget.js → PANEL_DEFAULTS
      (используются, только если панель с таким data-name отсутствует
      в этом prefab-файле — иначе в приоритете авторская разметка ниже).
    -->
    <style>
        /* Базовые стили панелей (темы ARSettings могут переопределять) */
        .ar-css3d-panel {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            background: rgba(8, 12, 24, 0.88);
            border: 2px solid rgba(0, 255, 170, 0.55);
            border-radius: 12px;
            padding: 10px 12px;
            /* уменьшает артефакты мерцания/дрожания текста у CSS3D-элементов
               при перспективных преобразованиях во время движения камеры */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            will-change: transform;
            pointer-events: auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ar-left-help-block,
        .ar-right-block {
            width: 160px;
            min-height: 140px;
            max-height: 200px;
        }

        .ar-main-block {
            width: 220px;
            min-height: 160px;
            max-height: 240px;
        }

        .ar-buttons-block {
            width: 200px;
            min-height: 56px;
            max-height: 120px;
            justify-content: center;
            align-items: center;
        }

        .ar-panel-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #00ffaa;
            line-height: 1.2;
            word-break: break-word;
        }

        .ar-panel-question,
        .ar-panel-maintext,
        .ar-panel-help {
            font-size: 12px;
            line-height: 1.35;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .ar-panel-help {
            color: #b8c4d8;
            flex: 1;
        }

        .ar-panel-image {
            display: block;
            width: 100%;
            height: auto;
            max-height: 160px;
            object-fit: contain;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.25);
        }

        .ar-panel-image:not([src]),
        .ar-panel-image[src=""] {
            display: none;
        }

        .ar-quest-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .ar-quest-options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }

        .ar-quest-btn,
        .ar-quest-submit-btn,
        .ar-slide-nav {
            appearance: none;
            border: 1px solid rgba(0, 255, 170, 0.6);
            background: rgba(0, 40, 30, 0.85);
            color: #e8fff6;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            line-height: 1.2;
        }

        .ar-quest-btn:hover,
        .ar-quest-submit-btn:hover,
        .ar-slide-nav:hover {
            background: rgba(0, 60, 45, 0.95);
            border-color: #00ffaa;
        }

        .ar-quest-input-block {
            display: flex;
            gap: 6px;
            width: 100%;
            align-items: center;
        }

        .ar-quest-input {
            flex: 1;
            min-width: 0;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font-size: 12px;
        }

        .ar-quest-slider {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .ar-slide-content {
            flex: 1;
            text-align: center;
            font-size: 11px;
            line-height: 1.3;
            min-height: 28px;
            word-break: break-word;
        }

        .ar-slide-nav {
            flex-shrink: 0;
            width: 28px;
            padding: 4px 0;
        }

        /* Пустые панели остаются видимыми (рамка), контент может быть пустым */
        .ar-panel-empty .ar-panel-help,
        .ar-panel-empty .ar-panel-title,
        .ar-panel-empty .ar-panel-question {
            opacity: 0.35;
        }
    </style>
</head>
<body>
<template id="ar-target">
    <!--
      data-name      — ключ в userData и имя CSS3DObject
      data-position  — x,y,z в метрах относительно маркера
      data-rotation  — rx,ry,rz в градусах (потом → радианы)
      data-scale     — единый scale CSS3DObject (по умолчанию 0.0005)
    -->

    <!-- LeftHelpBlock — help слева -->
    <div
            class="ar-css3d-panel ar-left-help-block"
            data-name="LeftHelpBlock"
            data-position="-0.17, 0.042, 0.001"
            data-rotation="-90, 12, 0"
            data-scale="0.00048"
    >
        <div class="ar-panel-help" data-field="help"></div>
    </div>

    <!-- MainBlock — вопрос / вариант ответа (центр) -->
    <div
            class="ar-css3d-panel ar-main-block"
            data-name="MainBlock"
            data-position="0, 0.03, 0.002"
            data-rotation="-90, 0, 0"
            data-scale="0.0005"
    >
        <div class="ar-panel-title" data-field="title"></div>
        <div class="ar-panel-question" data-field="question"></div>
        <div class="ar-panel-maintext" data-field="mainText"></div>
    </div>

    <!-- RightBlock — картинка для ответа (справа) -->
    <div
            class="ar-css3d-panel ar-right-block"
            data-name="RightBlock"
            data-position="0.17, 0.042, 0.001"
            data-rotation="-90, -12, 0"
            data-scale="0.00048"
    >
        <img class="ar-panel-image" data-field="imageSrc" alt="" />
        <div class="ar-panel-help" data-field="imageCaption"></div>
    </div>

    <!-- ButtonsBlock — место для кнопок (под центром) -->
    <div
            class="ar-css3d-panel ar-buttons-block"
            data-name="ButtonsBlock"
            data-position="0, -0.075, 0.004"
            data-rotation="-90, 0, 0"
            data-scale="0.0005"
    >
        <div class="ar-quest-body" data-field="buttons"></div>
    </div>
</template>
</body>
</html>
