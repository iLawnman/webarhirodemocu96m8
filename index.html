<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Marker Viewer</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    :root{
      --bg:#0b0d10;
      --panel:#12161b;
      --line:#232a31;
      --accent:#5ee3a5;
      --accent-dim:#2f7a58;
      --text:#e7ecef;
      --text-dim:#8a97a3;
      --danger:#e35e5e;
      --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
      --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;}

    .arjs-loader{
      position:fixed;inset:0;z-index:9999;background:var(--bg);
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
    }
    .arjs-loader .spinner{
      width:28px;height:28px;border-radius:50%;
      border:3px solid var(--line);border-top-color:var(--accent);
      animation:spin .9s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .arjs-loader p{font-family:var(--mono);font-size:12px;color:var(--text-dim);}

    /* —— compact chrome —— */
    .chrome{
      position:fixed;left:0;right:0;bottom:0;z-index:60;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:linear-gradient(0deg,rgba(11,13,16,.92),rgba(11,13,16,.55) 75%,transparent);
      display:flex;flex-direction:column;gap:8px;
      transition:opacity .2s,transform .2s;
    }
    body.ui-hidden .chrome{opacity:0;pointer-events:none;transform:translateY(16px);}

    .chrome-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

    .status-pill{
      font-family:var(--mono);font-size:11px;
      padding:6px 10px;border-radius:16px;
      background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
      display:flex;align-items:center;gap:6px;white-space:nowrap;
    }
    .status-pill .led{width:6px;height:6px;border-radius:50%;background:var(--text-dim);}
    .status-pill.found{border-color:var(--accent-dim);color:var(--accent);}
    .status-pill.found .led{background:var(--accent);box-shadow:0 0 6px var(--accent);}

    .seg{
      display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    }
    .seg button{
      border:0;background:transparent;color:var(--text-dim);
      padding:7px 10px;font-size:12px;cursor:pointer;
      border-right:1px solid var(--line);
    }
    .seg button:last-child{border-right:0;}
    .seg button.active{background:var(--accent);color:#06120c;font-weight:600;}

    .chip{
      font-family:var(--mono);font-size:11px;color:var(--text-dim);
      background:var(--panel);border:1px solid var(--line);border-radius:8px;
      padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      -webkit-tap-highlight-color:transparent;
    }
    .chip input{margin:0;}
    .chip.on{border-color:var(--accent-dim);color:var(--accent);}

    .file-btn{
      position:relative;overflow:hidden;
      font-size:12px;color:var(--text);
      background:var(--panel);border:1px solid var(--line);border-radius:8px;
      padding:7px 10px;cursor:pointer;white-space:nowrap;
    }
    .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .file-btn.has-file{border-color:var(--accent-dim);color:var(--accent);}
    #customFileWrap{display:none;}

    #diagStatus{font-family:var(--mono);font-size:10px;color:var(--text-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    #uiToggle{
      position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;z-index:90;
      font-family:var(--mono);font-size:11px;color:var(--text);
      background:rgba(18,22,27,.92);border:1px solid var(--line);border-radius:8px;
      padding:8px 10px;cursor:pointer;
    }
    body.ui-hidden #uiToggle{border-color:var(--accent-dim);color:var(--accent);}

    /* —— AR layers —— */
    a-scene{
      position:fixed !important;inset:0 !important;
      width:100% !important;height:100% !important;
      max-width:none !important;max-height:none !important;
    }
    video{
      position:fixed !important;top:0 !important;left:0 !important;
      width:100vw !important;height:100vh !important;height:100dvh !important;
      object-fit:cover !important;z-index:0 !important;margin:0 !important;padding:0 !important;
    }
    a-scene canvas, canvas.a-canvas{
      position:fixed !important;top:0 !important;left:0 !important;
      width:100vw !important;height:100vh !important;height:100dvh !important;
      z-index:1 !important;background:transparent !important;display:block !important;
      margin:0 !important;padding:0 !important;
    }

    /* Our own marker frame overlay (always under our control) */
    #markerFrame{
      position:fixed;inset:0;z-index:2;pointer-events:none;
      display:none;
    }
    #markerFrame.on{display:block;}
    #markerFrame .box{
      position:absolute;left:50%;top:50%;
      width:min(42vw,180px);height:min(42vw,180px);
      transform:translate(-50%,-50%);
      border:2px solid var(--accent);
      box-shadow:0 0 0 1px rgba(0,0,0,.35), 0 0 18px rgba(94,227,165,.35);
      border-radius:4px;
      opacity:.85;
    }
    #markerFrame .box::before,#markerFrame .box::after{
      content:"";position:absolute;width:18px;height:18px;border:3px solid var(--accent);
    }
    #markerFrame .box::before{top:-3px;left:-3px;border-right:0;border-bottom:0;}
    #markerFrame .box::after{bottom:-3px;right:-3px;border-left:0;border-top:0;}
    #markerFrame.found .box{border-color:#fff;box-shadow:0 0 22px rgba(94,227,165,.7);}

    /* AR.js native debug canvas — pinned top-left when present */
    canvas.arjs-debug-ui{
      position:fixed !important;
      top:8px !important;left:8px !important;
      width:160px !important;height:120px !important;
      z-index:80 !important;
      border:1px solid var(--accent-dim) !important;
      border-radius:6px !important;
      background:#000 !important;
      object-fit:contain !important;
      pointer-events:none !important;
    }
    body:not(.show-arjs-debug) canvas.arjs-debug-ui{display:none !important;}

    /* —— log (collapsed by default) —— */
    #logPanel{
      position:fixed;top:0;right:0;bottom:0;z-index:200;
      width:min(72vw,300px);
      background:rgba(10,12,15,.88);
      border-left:1px solid var(--line);
      display:flex;flex-direction:column;
      transform:translateX(0);
      transition:transform .25s ease;
    }
    #logPanel.hidden{transform:translateX(calc(100% - 26px));}
    #logEar{
      position:absolute;left:0;top:50%;transform:translate(-100%,-50%);
      width:26px;min-height:72px;padding:10px 0;
      display:flex;align-items:center;justify-content:center;
      background:rgba(10,12,15,.92);border:1px solid var(--line);border-right:0;
      border-radius:8px 0 0 8px;cursor:pointer;
    }
    #logEar span{
      writing-mode:vertical-rl;transform:rotate(180deg);
      font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text-dim);
    }
    #logPanel:not(.hidden) #logEar span{color:var(--accent);}
    #logPanelHead{
      flex:none;display:flex;align-items:center;justify-content:space-between;
      padding:8px 10px;border-bottom:1px solid var(--line);
      font-family:var(--mono);font-size:11px;color:var(--text-dim);
    }
    #logPanelHead button{
      font-family:var(--mono);font-size:11px;color:var(--text);
      background:var(--panel);border:1px solid var(--line);border-radius:6px;
      padding:3px 8px;cursor:pointer;
    }
    #logList{flex:1;overflow-y:auto;padding:8px 10px;font-family:var(--mono);font-size:10px;line-height:1.4;}
    #logList .entry{margin-bottom:5px;white-space:pre-wrap;word-break:break-word;}
    #logList .t{color:var(--text-dim);}
    #logList .lvl-info{color:var(--text);}
    #logList .lvl-warn{color:#e3c15e;}
    #logList .lvl-error{color:var(--danger);}
  </style>
</head>
<body class="show-arjs-debug">

<div class="chrome" id="chrome">
  <div class="chrome-row">
    <div id="statusPill" class="status-pill"><span class="led"></span><span id="statusText">поиск…</span></div>
    <div class="seg">
      <button id="btnHiro" class="active" type="button">Hiro</button>
      <button id="btnCustom" type="button">Свой</button>
    </div>
    <div id="customFileWrap">
      <label class="file-btn" id="fileBtn">
        <span id="fileBtnLabel">.patt…</span>
        <input type="file" id="pattFile" accept=".patt">
      </label>
    </div>
    <label class="chip on" id="debugChip">
      <input type="checkbox" id="debugToggle" checked> рамки
    </label>
    <span id="diagStatus"></span>
  </div>
</div>

<button id="uiToggle" type="button">UI</button>

<div class="arjs-loader" id="loader">
  <div class="spinner"></div>
  <p>Камера…</p>
</div>

<div id="markerFrame"><div class="box"></div></div>

<div id="logPanel" class="hidden">
  <button id="logEar" type="button" title="Лог"><span>ЛОГ</span></button>
  <div id="logPanelHead">
    <span>ЛОГ</span>
    <div style="display:flex;gap:6px;">
      <button id="logClearBtn" type="button">очистить</button>
      <button id="logHideBtn" type="button">✕</button>
    </div>
  </div>
  <div id="logList"></div>
</div>

<a-scene
  id="scene"
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: mediump; antialias: true; alpha: true"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  loading-screen="enabled: false"
>
  <a-assets></a-assets>

  <a-marker id="markerHiro" type="pattern" preset="hiro" url="assets/hiro.patt" emitevents="true" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
    <a-box position="0 0.5 0" depth="1" height="1" width="1"
           material="color:#5ee3a5; emissive:#2f7a58; emissiveIntensity:0.45; metalness:0.1; roughness:0.4"
           rotation="0 45 0"
           animation="property: rotation; to: 0 405 45; loop: true; dur: 6000; easing: linear">
    </a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
(function(){
  var logList = document.getElementById('logList');
  var logPanel = document.getElementById('logPanel');
  var logHideBtn = document.getElementById('logHideBtn');
  var logEar = document.getElementById('logEar');
  var logClearBtn = document.getElementById('logClearBtn');
  var logCount = 0;

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function timeStr(){
    var d = new Date();
    return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  function stringifyArg(a){
    if(a instanceof Error) return a.message;
    if(typeof a === 'object'){
      try { return JSON.stringify(a); } catch(e){ return String(a); }
    }
    return String(a);
  }
  function logToPanel(level, args){
    logCount++;
    var line = document.createElement('div');
    line.className = 'entry';
    var msg = Array.prototype.map.call(args, stringifyArg).join(' ');
    line.innerHTML = '<span class="t">['+timeStr()+']</span> <span class="lvl-'+level+'">'+
      msg.replace(/</g,'&lt;') + '</span>';
    logList.appendChild(line);
    logList.scrollTop = logList.scrollHeight;
    if(logCount > 200){ logList.removeChild(logList.firstChild); }
  }
  ['log','warn','error'].forEach(function(level){
    var original = console[level];
    console[level] = function(){
      logToPanel(level === 'log' ? 'info' : level, arguments);
      original.apply(console, arguments);
    };
  });
  window.addEventListener('error', function(e){
    logToPanel('error', ['JS: ' + e.message]);
  });
  logHideBtn.addEventListener('click', function(){ logPanel.classList.add('hidden'); });
  logEar.addEventListener('click', function(){ logPanel.classList.toggle('hidden'); });
  logClearBtn.addEventListener('click', function(){ logList.innerHTML = ''; logCount = 0; });

  console.log('AR v7 start');

  var scene = document.getElementById('scene');
  var loader = document.getElementById('loader');
  var statusPill = document.getElementById('statusPill');
  var statusText = document.getElementById('statusText');
  var markerHiro = document.getElementById('markerHiro');
  var btnHiro = document.getElementById('btnHiro');
  var btnCustom = document.getElementById('btnCustom');
  var customFileWrap = document.getElementById('customFileWrap');
  var fileInput = document.getElementById('pattFile');
  var fileBtn = document.getElementById('fileBtn');
  var fileBtnLabel = document.getElementById('fileBtnLabel');
  var diagStatus = document.getElementById('diagStatus');
  var debugToggle = document.getElementById('debugToggle');
  var debugChip = document.getElementById('debugChip');
  var markerFrame = document.getElementById('markerFrame');
  var uiToggle = document.getElementById('uiToggle');
  var customObjectUrl = null;

  function checkPattern(url, label){
    if(!url){ diagStatus.textContent = ''; return; }
    fetch(url, {cache:'no-store'}).then(function(res){
      if(res.ok){
        diagStatus.textContent = label + ' ✓';
        diagStatus.style.color = 'var(--accent)';
      } else {
        diagStatus.textContent = label + ' HTTP ' + res.status;
        diagStatus.style.color = 'var(--danger)';
      }
    }).catch(function(err){
      diagStatus.textContent = 'нет файла (нужен http/https)';
      diagStatus.style.color = 'var(--danger)';
    });
  }
  checkPattern('assets/hiro.patt', 'hiro.patt');

  scene.addEventListener('camera-error', function(e){
    diagStatus.textContent = 'камера: нет доступа';
    diagStatus.style.color = 'var(--danger)';
    console.error('camera-error', e.detail);
  });

  /* —— debug frames —— */
  function setDebugUi(on){
    document.body.classList.toggle('show-arjs-debug', !!on);
    debugToggle.checked = !!on;
    debugChip.classList.toggle('on', !!on);
    markerFrame.classList.toggle('on', !!on);
    pinArjsDebugCanvas();
  }
  function pinArjsDebugCanvas(){
    var show = document.body.classList.contains('show-arjs-debug');
    var list = document.querySelectorAll('canvas');
    var found = 0;
    for(var i = 0; i < list.length; i++){
      var c = list[i];
      if(c.classList.contains('a-canvas')) continue;
      if(c.parentElement && c.parentElement.closest && c.parentElement.closest('a-scene')) continue;
      // skip if it's the WebGL canvas (has webgl context)
      try{
        if(c.getContext && (c.getContext('webgl') || c.getContext('webgl2'))) continue;
      }catch(e){}
      c.classList.add('arjs-debug-ui');
      c.style.cssText = [
        'position:fixed','top:8px','left:8px','width:160px','height:120px',
        'z-index:80','border:1px solid #2f7a58','border-radius:6px',
        'background:#000','display:'+(show?'block':'none'),
        'object-fit:contain','pointer-events:none'
      ].join(' !important;') + ' !important;';
      found++;
    }
    if(found && !pinArjsDebugCanvas._logged){
      pinArjsDebugCanvas._logged = true;
      console.log('AR.js debug canvas: ' + found);
    }
  }
  debugToggle.addEventListener('change', function(){ setDebugUi(debugToggle.checked); });
  setDebugUi(true);
  [400, 1000, 2000, 4000, 8000].forEach(function(ms){ setTimeout(pinArjsDebugCanvas, ms); });
  if(window.MutationObserver){
    new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var nodes = muts[i].addedNodes;
        for(var j=0;j<nodes.length;j++){
          if(nodes[j] && nodes[j].nodeName === 'CANVAS'){ pinArjsDebugCanvas(); return; }
        }
      }
    }).observe(document.body, {childList:true, subtree:true});
  }

  uiToggle.addEventListener('click', function(){
    var hidden = document.body.classList.toggle('ui-hidden');
    uiToggle.textContent = hidden ? 'UI+' : 'UI';
  });

  scene.addEventListener('loaded', function(){ loader.style.display = 'none'; });
  setTimeout(function(){ loader.style.display = 'none'; }, 4000);

  setTimeout(function(){
    var video = document.querySelector('video');
    if(video) console.log('video ' + video.videoWidth + 'x' + video.videoHeight);
    else console.warn('no video');
  }, 2000);

  /* CSS size only — do not touch AR camera projection */
  var lastFs = '';
  function forceCssSize(){
    var w = window.innerWidth, h = window.innerHeight;
    var video = document.querySelector('video');
    var canvas = document.querySelector('canvas.a-canvas');
    if(video){
      video.style.setProperty('width', w+'px', 'important');
      video.style.setProperty('height', h+'px', 'important');
    }
    if(canvas){
      canvas.style.setProperty('width', w+'px', 'important');
      canvas.style.setProperty('height', h+'px', 'important');
    }
    var key = w+'x'+h;
    if(key !== lastFs){ lastFs = key; console.log('viewport '+key); }
  }
  [300,1000,2500].forEach(function(ms){ setTimeout(forceCssSize, ms); });
  window.addEventListener('resize', function(){ setTimeout(forceCssSize, 50); });
  window.addEventListener('orientationchange', function(){ setTimeout(forceCssSize, 300); });

  function setStatus(found){
    if(found){
      statusPill.classList.add('found');
      statusText.textContent = 'найден';
      markerFrame.classList.add('found');
    } else {
      statusPill.classList.remove('found');
      statusText.textContent = 'поиск…';
      markerFrame.classList.remove('found');
    }
  }

  if(markerHiro){
    markerHiro.addEventListener('markerFound', function(){
      setStatus(true);
      console.log('[AR] markerFound');
      if(markerHiro.object3D){
        markerHiro.object3D.visible = true;
        markerHiro.object3D.traverse(function(o){ o.visible = true; });
      }
    });
    markerHiro.addEventListener('markerLost', function(){
      setStatus(false);
      console.log('[AR] markerLost');
    });
  }

  btnHiro.addEventListener('click', function(){
    btnHiro.classList.add('active');
    btnCustom.classList.remove('active');
    customFileWrap.style.display = 'none';
    if(markerHiro){
      markerHiro.setAttribute('visible', 'true');
      if(markerHiro.object3D) markerHiro.object3D.visible = true;
    }
    checkPattern('assets/hiro.patt', 'hiro.patt');
    setStatus(false);
  });
  btnCustom.addEventListener('click', function(){
    btnCustom.classList.add('active');
    btnHiro.classList.remove('active');
    customFileWrap.style.display = 'block';
    console.warn('Кастомный .patt: маркер в HTML отключён');
  });
  fileInput.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    fileBtnLabel.textContent = file.name;
    fileBtn.classList.add('has-file');
    console.warn('Нужен раскомментированный a-marker custom в HTML');
  });
})();
</script>
</body>
</html>
