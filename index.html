<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Image Quest</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.4.2/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>
<body>
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-nft
      id="imageTarget"
      type="nft"
      url="assets/markerT1.patt"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-entity id="arTarget" visible="false">
        <a-image
          id="arTargetImage"
          src="assets/asset.png"
          position="0 0 0"
          width="1"
          height="1"
        ></a-image>
        <a-plane
          id="answerButton"
          class="clickable"
          color="#2E8B57"
          position="0 -0.75 0"
          width="1"
          height="0.35"
        >
          <a-text
            value="Ответить"
            align="center"
            color="#FFFFFF"
            position="0 0 0.01"
            width="2"
          ></a-text>
        </a-plane>
      </a-entity>
    </a-nft>

    <a-entity camera>
      <a-cursor fuse="false" raycaster="objects: .clickable"></a-cursor>
    </a-entity>
  </a-scene>

  <script type="module" src="js/app/Bootstrap.js"></script>
</body>
</html>
