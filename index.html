<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2 AR Marker Viewer</title>

  <!-- Official combo from AR.js docs: A-Frame 1.6.0 + AR.js 3.4.7 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    :root{
      --panel:#12161b;
      --line:#232a31;
      --accent:#5ee3a5;
      --accent-dim:#2f7a58;
      --text:#e7ecef;
      --text-dim:#8a97a3;
      --danger:#e35e5e;
      --mono:"IBM Plex Mono",Consolas,monospace;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:system-ui,sans-serif;}

    /* Do NOT force video/canvas to 100vw×100vh — that breaks AR.js
       projection and the  detaches from the marker even when found. */

    .chrome{
      position:fixed;left:0;right:0;bottom:0;z-index:50;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.4) 70%,transparent);
      display:flex;gap:8px;align-items:center;flex-wrap:wrap;
      transition:opacity .2s,transform .2s;
    }
    body.ui-hidden .chrome{opacity:0;pointer-events:none;transform:translateY(12px);}

    .pill{
      font-family:var(--mono);font-size:11px;
      padding:6px 10px;border-radius:14px;
      background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
      display:inline-flex;align-items:center;gap:6px;
    }
    .pill .led{width:6px;height:6px;border-radius:50%;background:var(--text-dim);}
    .pill.found{border-color:var(--accent-dim);color:var(--accent);}
    .pill.found .led{background:var(--accent);box-shadow:0 0 6px var(--accent);}

    .chip{
      font-family:var(--mono);font-size:11px;color:var(--text-dim);
      background:var(--panel);border:1px solid var(--line);border-radius:8px;
      padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
    }
    .chip.on{border-color:var(--accent-dim);color:var(--accent);}
    .chip input{margin:0;}

    #diag{font-family:var(--mono);font-size:10px;color:var(--text-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    #uiToggle{
      position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;z-index:60;
      font-family:var(--mono);font-size:11px;color:var(--text);
      background:rgba(18,22,27,.92);border:1px solid var(--line);border-radius:8px;
      padding:8px 10px;cursor:pointer;
    }
    body.ui-hidden #uiToggle{border-color:var(--accent-dim);color:var(--accent);}

    /* AR.js debug canvas (threshold view) */
    canvas.arjs-debug-ui{
      position:fixed !important;top:8px !important;left:8px !important;
      width:140px !important;height:105px !important;
      z-index:40 !important;border:1px solid var(--accent-dim) !important;
      border-radius:6px !important;background:#000 !important;
      pointer-events:none !important;
    }
    body:not(.show-debug) canvas.arjs-debug-ui{display:none !important;}

    /* log */
    #logPanel{
      position:fixed;top:0;right:0;bottom:0;z-index:100;
      width:min(70vw,280px);background:rgba(10,12,15,.9);
      border-left:1px solid var(--line);display:flex;flex-direction:column;
      transform:translateX(0);transition:transform .25s ease;
    }
    #logPanel.hidden{transform:translateX(calc(100% - 24px));}
    #logEar{
      position:absolute;left:0;top:50%;transform:translate(-100%,-50%);
      width:24px;min-height:64px;display:flex;align-items:center;justify-content:center;
      background:rgba(10,12,15,.92);border:1px solid var(--line);border-right:0;
      border-radius:8px 0 0 8px;cursor:pointer;
    }
    #logEar span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10px;color:var(--text-dim);}
    #logHead{padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;}
    #logHead button{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:3px 8px;cursor:pointer;}
    #logList{flex:1;overflow:auto;padding:8px;font-family:var(--mono);font-size:10px;line-height:1.4;}
    #logList .e{margin-bottom:4px;word-break:break-word;}
    #logList .t{color:var(--text-dim);}
    #logList .err{color:var(--danger);}
    #logList .ok{color:var(--accent);}

    .loader{
      position:fixed;inset:0;z-index:9999;background:#000;
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
      font-family:var(--mono);font-size:12px;color:var(--text-dim);
    }
    .loader .sp{
      width:26px;height:26px;border-radius:50%;
      border:3px solid #333;border-top-color:var(--accent);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body class="show-debug">

<div class="loader" id="loader"><div class="sp"></div><span>камера…</span></div>

<div class="chrome">
  <div class="pill" id="statusPill"><span class="led"></span><span id="statusText">поиск…</span></div>
  <label class="chip on" id="debugChip"><input type="checkbox" id="debugToggle" checked> рамки</label>
  <span id="diag"></span>
</div>
<button id="uiToggle" type="button">UI</button>

<div id="logPanel" class="hidden">
  <button id="logEar" type="button"><span>ЛОГ</span></button>
  <div id="logHead"><span>ЛОГ</span><button id="logClear" type="button">очистить</button></div>
  <div id="logList"></div>
</div>

<!-- Minimal AR.js scene — mirrors official basic example.
      is a CHILD of a-marker so it follows the tracked pose. -->
<a-scene
  id="scene"
  embedded
  vr-mode-ui="enabled: false"
  renderer="antialias: true; alpha: true; precision: mediump"
  arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono; trackingMethod: best;"
  loading-screen="enabled: false"
>
  <a-marker id="marker" preset="hiro" emitevents="true">
    <!-- Bright  sitting on the marker plane (Y up in marker space) -->
    <a-box
      id=""
      position="0 0.5 0"
      width="1" height="1" depth="1"
      color="#ff2d55"
      material="shader: flat"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
    </a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
(function () {
  var logList = document.getElementById('logList');
  var logPanel = document.getElementById('logPanel');
  var n = 0;
  function t() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
  }
  function panelLog(cls, msg) {
    n++;
    var el = document.createElement('div');
    el.className = 'e';
    el.innerHTML = '<span class="t">[' + t() + ']</span> <span class="' + (cls || '') + '">' + String(msg).replace(/</g, '&lt;') + '</span>';
    logList.appendChild(el);
    logList.scrollTop = logList.scrollHeight;
    if (n > 150 && logList.firstChild) logList.removeChild(logList.firstChild);
  }
  ['log', 'warn', 'error'].forEach(function (lvl) {
    var orig = console[lvl];
    console[lvl] = function () {
      var msg = Array.prototype.slice.call(arguments).map(function (a) {
        if (a instanceof Error) return a.message;
        if (typeof a === 'object') { try { return JSON.stringify(a); } catch (e) { return String(a); } }
        return String(a);
      }).join(' ');
      panelLog(lvl === 'error' ? 'err' : (lvl === 'warn' ? '' : ''), msg);
      orig.apply(console, arguments);
    };
  });
  window.addEventListener('error', function (e) { panelLog('err', 'JS: ' + e.message); });

  document.getElementById('logEar').onclick = function () { logPanel.classList.toggle('hidden'); };
  document.getElementById('logClear').onclick = function () { logList.innerHTML = ''; n = 0; };

  var scene = document.getElementById('scene');
  var marker = document.getElementById('marker');
  var  = document.getElementById('');
  var statusPill = document.getElementById('statusPill');
  var statusText = document.getElementById('statusText');
  var diag = document.getElementById('diag');
  var loader = document.getElementById('loader');
  var debugToggle = document.getElementById('debugToggle');
  var debugChip = document.getElementById('debugChip');

  function setFound(on) {
    statusPill.classList.toggle('found', on);
    statusText.textContent = on ? 'маркер · куб' : 'поиск…';
  }

  function pinDebug() {
    var show = document.body.classList.contains('show-debug');
    var list = document.querySelectorAll('canvas');
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (c.classList.contains('a-canvas')) continue;
      if (c.closest && c.closest('a-scene')) continue;
      c.classList.add('arjs-debug-ui');
      c.style.setProperty('display', show ? 'block' : 'none', 'important');
      c.style.setProperty('position', 'fixed', 'important');
      c.style.setProperty('top', '8px', 'important');
      c.style.setProperty('left', '8px', 'important');
      c.style.setProperty('width', '140px', 'important');
      c.style.setProperty('height', '105px', 'important');
      c.style.setProperty('z-index', '40', 'important');
    }
  }
  debugToggle.onchange = function () {
    document.body.classList.toggle('show-debug', debugToggle.checked);
    debugChip.classList.toggle('on', debugToggle.checked);
    pinDebug();
  };
  [500, 1500, 3000, 6000].forEach(function (ms) { setTimeout(pinDebug, ms); });

  document.getElementById('uiToggle').onclick = function () {
    var h = document.body.classList.toggle('ui-hidden');
    this.textContent = h ? 'UI+' : 'UI';
  };

  scene.addEventListener('loaded', function () {
    loader.style.display = 'none';
    console.log('scene loaded');
  });
  scene.addEventListener('camera-error', function (e) {
    diag.textContent = 'нет камеры / нужен https';
    diag.style.color = 'var(--danger)';
    console.error('camera-error', e.detail);
  });
  setTimeout(function () { loader.style.display = 'none'; }, 5000);

  marker.addEventListener('markerFound', function () {
    setFound(true);
    console.log('[AR] markerFound');
    // Ensure hierarchy is visible —  is child of marker, so it
    // inherits the marker pose automatically.
    if (marker.object3D) marker.object3D.visible = true;
    if ( && .object3D) {
      .object3D.visible = true;
      var p = .object3D.getWorldPosition(new THREE.Vector3());
      console.log('[AR]  world pos', p.x.toFixed(2), p.y.toFixed(2), p.z.toFixed(2));
    }
  });
  marker.addEventListener('markerLost', function () {
    setFound(false);
    console.log('[AR] markerLost');
  });

  console.log('AR v8 — preset hiro, cube child of marker');
})();
</script>
</body>
</html>
